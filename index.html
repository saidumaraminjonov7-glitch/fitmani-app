      0% { translate: 0px 0px; }
      100% { translate: 5px -7px; }
    }

    @keyframes spotPulseKick {
      0% { scale: 1; }
      45% { scale: 1.14; }
      100% { scale: 1; }
    }

    /* Springy tactile animations */
    button, .step-card, .ex-row, .track-row, .choice-card, .mood-chip, .preset-chip {
      transition:
        transform 0.24s var(--spring),
        background-color 0.2s var(--ease),
        box-shadow 0.2s var(--ease),
        border-color 0.2s var(--ease);
    }

    button:hover, .step-card:hover, .ex-row:hover, .track-row:hover, .choice-card:hover, .mood-chip:hover, .preset-chip:hover {
      transform: translateY(-2px);
    }

    button:active, .step-card:active, .ex-row:active, .track-row:active, .choice-card:active, .mood-chip:active, .preset-chip:active {
      transform: scale(0.94);
    }

      animation: spotKick 0.38s var(--spring);
    }

    @keyframes spotKick {
      0% { transform: scale(0.92); }

      if (!tg || !tg.HapticFeedback) return;

    }
