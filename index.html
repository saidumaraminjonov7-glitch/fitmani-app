<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FITMANI — 5D Fitness Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-void: #030404;
      --bg-panel: rgba(12, 18, 15, 0.72);
      --bg-panel-hover: rgba(18, 28, 23, 0.88);
      --neon: #18e068;
      --neon-soft: rgba(24, 224, 104, 0.16);
      --neon-glow: 0 0 24px rgba(24, 224, 104, 0.35);
      --accent-amber: #ffb830;
      --text-main: #f3fff7;
      --text-muted: #8ca396;
      --border: rgba(24, 224, 104, 0.22);
      --px: 0px;
      --py: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-void);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      overflow-x: hidden;
      perspective: 1200px;
    }

    /* 5D Ko'p qatlamli Dalmatin fon va chuqurlik */
    .stage-5d {
      position: fixed;
      inset: -40px;
      pointer-events: none;
      z-index: 0;
      transform-style: preserve-3d;
    }

    .layer-spots {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 14% 18%, rgba(24, 224, 104, 0.22) 0 38px, transparent 40px),
        radial-gradient(circle at 82% 14%, rgba(24, 224, 104, 0.16) 0 54px, transparent 56px),
        radial-gradient(circle at 68% 48%, rgba(24, 224, 104, 0.20) 0 28px, transparent 30px),
        radial-gradient(circle at 24% 66%, rgba(24, 224, 104, 0.18) 0 46px, transparent 48px),
        radial-gradient(circle at 86% 82%, rgba(24, 224, 104, 0.24) 0 34px, transparent 36px),
        radial-gradient(circle at 46% 88%, rgba(24, 224, 104, 0.14) 0 22px, transparent 24px);
      transform: translate3d(calc(var(--px) * 14px), calc(var(--py) * 14px), -60px) scale(1.06);
      transition: transform 0.18s ease-out;
      filter: blur(0.4px);
    }

    .layer-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(24, 224, 104, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 224, 104, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: translate3d(calc(var(--px) * 26px), calc(var(--py) * 26px), -20px) rotateX(8deg);
      transition: transform 0.18s ease-out;
      mask-image: radial-gradient(circle at 50% 35%, black 25%, transparent 80%);
    }

    .ambient-orb {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(24, 224, 104, 0.20), transparent 70%);
      top: 8%;
      left: 50%;
      transform: translate3d(calc(-50% + var(--px) * 36px), calc(var(--py) * 36px), 30px);
      transition: transform 0.2s ease-out;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 96px;
    }

    /* 5D Kartalar */
    .card-5d {
      background: var(--bg-panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: rotateY(calc(var(--px) * 4deg)) rotateX(calc(var(--py) * -4deg));
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out, border-color 0.25s ease, background 0.25s ease;
    }

    .card-5d:hover {
      border-color: rgba(24, 224, 104, 0.48);
      background: var(--bg-panel-hover);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(24, 224, 104, 0.28), rgba(6, 36, 18, 0.9));
      border: 1px solid rgba(24, 224, 104, 0.55);
      box-shadow: var(--neon-glow);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 18px;
      color: var(--neon);
      transform: translateZ(18px);
    }

    .brand h1 {
      font-size: 20px;
      letter-spacing: 0.8px;
      font-weight: 800;
    }

    .brand p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .pill-5d {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--neon);
      background: var(--neon-soft);
      border: 1px solid rgba(24, 224, 104, 0.35);
      transform: translateZ(14px);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      transform: translateZ(12px);
    }

    .section-title h2 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .section-title span {
      font-size: 12px;
      color: var(--neon);
      font-weight: 600;
    }

    /* Taymer */
    .timer-display {
      text-align: center;
      font-size: 44px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 24px rgba(24, 224, 104, 0.28);
      margin: 8px 0 14px;
      transform: translateZ(24px);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #18e068, #0ca84b);
      color: #031209;
      border: none;
      font-weight: 800;
      box-shadow: var(--neon-glow);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    /* Musiqa / MP3 */
    .music-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .input:focus {
      border-color: var(--neon);
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }

    .track-item.active {
      border-color: rgba(24, 224, 104, 0.5);
      background: var(--neon-soft);
    }

    .track-meta {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-meta small {
      color: var(--text-muted);
      display: block;
      font-size: 11px;
    }

    /* Kaloriya */
    .kcal-summary {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .kcal-total {
      font-size: 26px;
      font-weight: 800;
      color: var(--neon);
    }

    .meal-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 13px;
    }

    .del-btn {
      background: transparent;
      border: none;
      color: #ff6b6b;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      background: rgba(5, 8, 6, 0.88);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: center;
    }

    .bottom-inner {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="stage-5d" aria-hidden="true">
    <div class="layer-spots"></div>
    <div class="layer-grid"></div>
    <div class="ambient-orb"></div>
  </div>

  <main class="app">
    <header class="card-5d header">
      <div class="brand">
        <div class="brand-badge">F5</div>
        <div>
          <h1>FITMANI</h1>
          <p>Pitch-Black • Dalmatin • 5D Studio</p>
        </div>
      </div>
      <div class="pill-5d">5D ACTIVE</div>
    </header>

    <!-- 1. Mashg'ulot Taymeri -->
    <section class="card-5d">
      <div class="section-title">
        <h2>Mashg'ulot Taymeri</h2>
        <span id="timerStatus">Tayyor</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:45</div>
      <div class="presets">
        <button class="btn" onclick="setPreset(30)">30s</button>
        <button class="btn" onclick="setPreset(45)">45s</button>
        <button class="btn" onclick="setPreset(60)">60s</button>
        <button class="btn" onclick="setPreset(90)">90s</button>
      </div>
      <div class="controls-row">
        <button class="btn btn-primary" id="toggleTimerBtn" onclick="toggleTimer()">Boshlash</button>
        <button class="btn" onclick="resetTimer()">Qayta</button>
      </div>
    </section>

    <!-- 2. Musiqa Qidirish va MP3 Pleer -->
    <section class="card-5d">
      <div class="section-title">
        <h2>Workout Musiqa & MP3</h2>
        <span id="nowPlayingLabel">Trek tanlanmagan</span>
      </div>
      <div class="music-row">
        <input class="input" id="musicSearchInput" type="text" placeholder="Trek yoki uslub qidiring (masalan: Phonk, Gym)..." oninput="filterTracks()" />
        <label class="btn" style="display:grid;place-items:center;">
          + MP3
          <input type="file" accept="audio/*" multiple hidden onchange="handleMp3Upload(event)" />
        </label>
      </div>
      <audio id="audioPlayer" controls style="width:100%; margin-top:6px; border-radius:12px;"></audio>
      <div class="track-list" id="trackList"></div>
    </section>

    <!-- 3. Kaloriya va Taom Hisoblagichi -->
    <section class="card-5d">
      <div class="section-title">
        <h2>Kaloriya Hisoblagich</h2>
        <span>Kunlik nazorat</span>
      </div>
      <div class="kcal-summary">
        <div>
          <div style="font-size:12px;color:var(--text-muted);">Jami iste'mol</div>
          <div class="kcal-total" id="totalKcal">0 kkal</div>
        </div>
        <button class="btn" onclick="clearMeals()">Tozalash</button>
      </div>
      <div class="music-row">
        <input class="input" id="mealNameInput" type="text" placeholder="Taom (masalan: Tovuq ko'kragi)" />
        <input class="input" id="mealKcalInput" type="number" placeholder="kkal" style="max-width:96px;" />
        <button class="btn btn-primary" onclick="addMeal()">+</button>
      </div>
      <div class="meal-list" id="mealList"></div>
    </section>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <span id="tgUserInfo">Fitmani Mini App</span>
      <button class="btn" style="padding:7px 12px;font-size:12px;" onclick="sendSummaryToBot()">Natijani Botga Yuborish</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u && u.first_name) {
        document.getElementById("tgUserInfo").textContent = "Salom, " + u.first_name + "!";
      }
    }

    // 5D Parallaks (sichqoncha va giroskop)
    function update5D(nx, ny) {
      document.documentElement.style.setProperty("--px", nx.toFixed(3));
      document.documentElement.style.setProperty("--py", ny.toFixed(3));
    }
    window.addEventListener("pointermove", (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      update5D(nx, ny);
    });
    window.addEventListener("deviceorientation", (e) => {
      if (e.gamma !== null && e.beta !== null) {
        const nx = Math.max(-1, Math.min(1, e.gamma / 30));
        const ny = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
        update5D(nx, ny);
      }
    });

    // Taymer logikasi
    let remaining = 45;
    let timerInterval = null;

    function renderTimer() {
      const m = String(Math.floor(remaining / 60)).padStart(2, "0");
      const s = String(remaining % 60).padStart(2, "0");
      document.getElementById("timerDisplay").textContent = `${m}:${s}`;
    }

    function setPreset(sec) {
      clearInterval(timerInterval);
      timerInterval = null;
      remaining = sec;
      document.getElementById("toggleTimerBtn").textContent = "Boshlash";
      document.getElementById("timerStatus").textContent = "Tayyor";
      renderTimer();
    }

    function toggleTimer() {
      const btn = document.getElementById("toggleTimerBtn");
      const status = document.getElementById("timerStatus");
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.textContent = "Davom ettirish";
        status.textContent = "Pauza";
        return;
      }
      if (remaining <= 0) remaining = 45;
      btn.textContent = "To'xtatish";
      status.textContent = "Ishlamoqda";
      timerInterval = setInterval(() => {
        remaining--;
        renderTimer();
        if (remaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          btn.textContent = "Boshlash";
          status.textContent = "Tugadi!";
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        }
      }, 1000);
    }

    function resetTimer() {
      setPreset(45);
    }

    // Musiqa va MP3 ro'yxati
    let tracks = [
      { id: "t1", title: "Dalmatin Bass Boost", tag: "Gym • 128 BPM", url: "" },
      { id: "t2", title: "Night Street Workout", tag: "Vorkaut • Dark", url: "" },
      { id: "t3", title: "Cardio Pulse Energy", tag: "HIIT • 140 BPM", url: "" }
    ];
    let activeTrackId = null;

    function renderTracks(filter = "") {
      const list = document.getElementById("trackList");
      const q = filter.trim().toLowerCase();
      const filtered = tracks.filter(t => !q || t.title.toLowerCase().includes(q) || t.tag.toLowerCase().includes(q));
      list.innerHTML = "";
      filtered.forEach(t => {
        const div = document.createElement("div");
        div.className = "track-item" + (t.id === activeTrackId ? " active" : "");
        div.innerHTML = `
          <div class="track-meta">
            <strong>${t.title}</strong>
            <small>${t.tag}</small>
          </div>
          <button class="btn" style="padding:6px 10px;font-size:12px;" onclick="selectTrack('${t.id}')">
            ${t.id === activeTrackId ? "Tanlangan" : "Tanlash"}
          </button>
        `;
        list.appendChild(div);
      });
    }

    function filterTracks() {
      renderTracks(document.getElementById("musicSearchInput").value);
    }

    function handleMp3Upload(event) {
      const files = Array.from(event.target.files || []);
      files.forEach((file, idx) => {
        const url = URL.createObjectURL(file);
        const id = "mp3_" + Date.now() + "_" + idx;
        tracks.unshift({ id, title: file.name.replace(/\.[^/.]+$/, ""), tag: "Yuklangan MP3", url });
      });
      renderTracks(document.getElementById("musicSearchInput").value);
      if (files[0]) {
        selectTrack(tracks[0].id);
      }
    }

    function selectTrack(id) {
      const track = tracks.find(t => t.id === id);
      if (!track) return;
      activeTrackId = id;
      document.getElementById("nowPlayingLabel").textContent = track.title;
      const player = document.getElementById("audioPlayer");
      if (track.url) {
        player.src = track.url;
        player.play().catch(() => {});
      }
      renderTracks(document.getElementById("musicSearchInput").value);
    }

    // Kaloriya hisoblagich
    let meals = JSON.parse(localStorage.getItem("fitmani_meals_5d") || "[]");

    function renderMeals() {
      const list = document.getElementById("mealList");
      list.innerHTML = "";
      let total = 0;
      meals.forEach((m, i) => {
        total += Number(m.kcal) || 0;
        const row = document.createElement("div");
        row.className = "meal-item";
        row.innerHTML = `
          <span>${m.name}</span>
          <span>
            <strong style="color:var(--neon);margin-right:8px;">${m.kcal} kkal</strong>
            <button class="del-btn" onclick="removeMeal(${i})">✕</button>
          </span>
        `;
        list.appendChild(row);
      });
      document.getElementById("totalKcal").textContent = total + " kkal";
      localStorage.setItem("fitmani_meals_5d", JSON.stringify(meals));
    }

    function addMeal() {
      const nameEl = document.getElementById("mealNameInput");
      const kcalEl = document.getElementById("mealKcalInput");
      const name = nameEl.value.trim();
      const kcal = parseInt(kcalEl.value, 10);
      if (!name || isNaN(kcal) || kcal <= 0) return;
      meals.unshift({ name, kcal });
      nameEl.value = "";
      kcalEl.value = "";
      renderMeals();
    }

    function removeMeal(index) {
      meals.splice(index, 1);
      renderMeals();
    }

    function clearMeals() {
      meals = [];
      renderMeals();
    }

    function sendSummaryToBot() {
      const total = meals.reduce((acc, m) => acc + (Number(m.kcal) || 0), 0);
      const payload = JSON.stringify({
        app: "FITMANI_5D",
        timer_remaining_sec: remaining,
        total_kcal: total,
        meals_count: meals.length
      });
      if (tg) {
        tg.sendData(payload);
      } else {
        alert("FITMANI 5D natijasi: " + total + " kkal, taymer: " + remaining + "s");
      }
    }

    renderTimer();
    renderTracks();
    renderMeals();
  </script>
</body>
</html>
